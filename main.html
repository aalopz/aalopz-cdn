<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>CDN</title>
	<style>
		:root { color-scheme: dark; --ink: #ededed; --muted: #a9a9a9; --line: #3d3d3d; --hover: rgba(70, 70, 70, .3); --page: #000; --input: #161616; }
		* { box-sizing: border-box; }
		body { margin: 0; min-width: 320px; color: var(--ink); background-color: var(--page); background-image: linear-gradient(rgba(255, 255, 255, .035) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, .035) 1px, transparent 1px), linear-gradient(to bottom, #000 0%, #123b8f 52%, #5074ad 100%); background-repeat: repeat, repeat, no-repeat; background-attachment: scroll, scroll, fixed; background-size: 32px 32px, 32px 32px, 100% 100%; font: 14px Arial, sans-serif; }
		.container { width: min(920px, calc(100% - 32px)); margin: 0 auto; padding: 42px 0 64px; }
		.header { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 34px; }
		.header-tools { display: flex; align-items: center; gap: 12px; }
		h1 { margin: 0 0 8px; font-size: 25px; font-weight: 400; }
		.subtitle { margin: 0; color: var(--muted); }
		.search { width: min(300px, 100%); }
		#filter { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 3px; outline: 0; color: var(--ink); background: rgba(70, 70, 70, .3); }
		#filter { transition: border-color .18s ease, background-color .18s ease; }
		#filter:focus { border-color: #888; }
		.toolbar { display: flex; align-items: center; justify-content: space-between; min-height: 38px; margin-bottom: 8px; }
		.toolbar-controls { display: flex; align-items: center; gap: 12px; }
		.toolbar h2 { margin: 0; font-size: 15px; font-weight: 600; }
		.sort-label { color: var(--muted); font-size: 12px; }
		#sort { padding: 7px 9px; border: 1px solid var(--line); border-radius: 3px; color: var(--ink); background: rgba(70, 70, 70, .3); font: inherit; }
		#status { color: var(--muted); font-size: 13px; }
		.table { width: 100%; border-collapse: collapse; border-top: 1px solid var(--line); table-layout: fixed; }
		.table th { padding: 11px 14px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 12px; font-weight: 400; text-align: left; vertical-align: middle; }
		.table th:first-child { width: 64%; }
		.table th:first-child { padding-left: 48px; }
		.table th:nth-child(2) { width: 22%; }
		.table th:last-child { width: 90px; text-align: right; }
		.table td { height: 52px; padding: 8px 14px; border-bottom: 1px solid var(--line); overflow: hidden; color: var(--muted); text-overflow: ellipsis; white-space: nowrap; vertical-align: middle; transition: background-color .18s ease, color .18s ease; }
		.table td:last-child { text-align: right; }
		.table tr:hover td { background: var(--hover); color: var(--ink); }
		.name-cell { display: flex; align-items: center; gap: 12px; color: var(--ink); line-height: 1; }
		.folder-icon { color: var(--muted); font-size: 17px; }
		.page-link, .open-link { color: var(--ink); text-decoration: none; }
		.page-link, .open-link { transition: color .18s ease; }
		.open-link { display: inline-flex; align-items: center; line-height: 1; }
		.date-cell { display: inline-flex; align-items: center; line-height: 1; }
		.page-link:hover, .open-link:hover { text-decoration: underline; color: #b9d3ff; }
		.empty { padding: 24px 14px; color: var(--muted); }
		.site-footer { position: fixed; right: 0; bottom: 0; left: 0; z-index: 10; padding: 12px 16px; border-top: 1px solid var(--line); background: var(--input); text-align: center; }
		.site-footer a { color: var(--ink); }
		.page-window { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 24px; background: rgba(0, 0, 0, .65); }
		.page-window[hidden] { display: none; }
		.page-window-content { display: flex; width: min(1200px, 100%); height: min(800px, 100%); flex-direction: column; border: 1px solid var(--line); background: var(--page); box-shadow: 0 12px 40px rgba(0, 0, 0, .35); }
		.page-window.is-fullscreen { padding: 0; }
		.page-window.is-fullscreen .page-window-content { width: 100%; height: 100%; border: 0; }
		.page-window.is-header-hidden .page-window-bar { display: none; }
		.page-window-bar { display: flex; align-items: center; justify-content: space-between; min-height: 44px; padding: 0 14px; border-bottom: 1px solid var(--line); color: var(--ink); }
		.page-window-header-toggle { position: absolute; top: 8px; left: 50%; z-index: 1; display: none; width: 34px; height: 34px; padding: 0; border: 1px solid var(--line); border-radius: 4px; color: var(--ink); background: var(--input); font-size: 20px; line-height: 1; cursor: pointer; transform: translateX(-50%); }
		.page-window-header-toggle:hover { background: var(--hover); }
		.page-window.is-fullscreen .page-window-header-toggle { display: block; }
		.page-window-actions { display: flex; gap: 8px; }
		.page-window-button { padding: 5px 10px; border: 1px solid var(--line); border-radius: 3px; color: var(--ink); background: var(--input); cursor: pointer; }
		.page-window-button:hover { background: var(--hover); }
		.page-window-panic { color: #ffb4ab; }
		#page-frame { width: 100%; flex: 1; border: 0; background: #fff; }
		@media (max-width: 720px) {
			.container { width: min(100% - 24px, 920px); padding: 28px 0 40px; }
			.header { display: block; }
			.search { display: block; width: 100%; margin-top: 22px; }
			.toolbar { align-items: flex-start; flex-direction: column; gap: 10px; }
			.toolbar-controls { width: 100%; justify-content: space-between; }
			.table th:first-child { width: 64%; }
			.page-window { padding: 10px; }
		}
	</style>
</head>
<body>
	<main class="container">
		<header class="header">
			<div><h1>aalopz CDN</h1><p class="subtitle">Available pages</p></div>
			<div class="header-tools">
				<label class="search" for="filter"><input id="filter" type="search" placeholder="Search pages" aria-label="Search pages"></label>
			</div>
		</header>
		<div class="toolbar"><h2>Pages</h2><div class="toolbar-controls"><label class="sort-label" for="sort">Sort by</label><select id="sort" aria-label="Sort pages"><option value="name-asc">Name A-Z</option><option value="name-desc">Name Z-A</option><option value="date-desc">Date added newest</option><option value="date-asc">Date added oldest</option></select><p id="status" aria-live="polite">Loading pages...</p></div></div>
			<table class="table">
				<thead><tr><th>Name</th><th>Date added</th><th>Open</th></tr></thead>
				<tbody id="pages" aria-live="polite"></tbody>
			</table>
	</main>
	<section class="page-window" id="page-window" hidden aria-label="Page preview">
		<div class="page-window-content">
			<div class="page-window-bar"><span id="page-window-title">Page</span><div class="page-window-actions"><button class="page-window-button" id="page-window-fullscreen" type="button" aria-pressed="false">Fullscreen</button><button class="page-window-button page-window-panic" id="page-window-panic" type="button">Panic</button><button class="page-window-button" id="page-window-close" type="button">Close</button></div></div>
			<iframe id="page-frame" title="Selected page"></iframe>
		</div>
		<button class="page-window-header-toggle" id="page-window-header-toggle" type="button" aria-label="Hide viewer header" aria-expanded="true" title="Hide viewer header">↑</button>
	</section>
	<footer class="site-footer"><a href="https://docs.google.com/forms/d/e/1FAIpQLScOfplqMiiXHN0TWOAVP_gAOiaIfdgBWS3VvjLhO5C-Ba8JNA/viewform?usp=header" target="_blank" rel="noopener noreferrer">Problems / Requests</a></footer>
	<script>
		const repository = 'aalopz/aalopz-cdn';
		const branch = 'main';
		const pagesElement = document.querySelector('#pages');
		const statusElement = document.querySelector('#status');
		const filterElement = document.querySelector('#filter');
		const sortElement = document.querySelector('#sort');
		const pageWindow = document.querySelector('#page-window');
		const pageWindowTitle = document.querySelector('#page-window-title');
		const pageFrame = document.querySelector('#page-frame');
		const pageWindowClose = document.querySelector('#page-window-close');
		const pageWindowFullscreen = document.querySelector('#page-window-fullscreen');
		const pageWindowHeaderToggle = document.querySelector('#page-window-header-toggle');
		const pageWindowPanic = document.querySelector('#page-window-panic');
		const fallbackPaths = [
			'a-dance-of-fire-and-ice/index.html', 'awesome-tanks/index.htm', 'bloons-td5/index.html',
			'cluster-truck/index.html', 'cookie-clicker/index.html', 'crazy-cattle-3d/index.html',
			'eaglercraft/index.html', 'getting-over-it/index.html', 'jelly-drift/index.html',
			'ovo/index.html', 'papas-burgeria/index.htm', 'papas-freezeria/index.htm',
			'papas-pancakeria/index.htm', 'papas-pizzeria/index.html', 'papas-wingeria/index.htm',
			'polytrack/index.html', 'red-ball-4/index.html', 'slime-rancher/index.html',
			'slow-roads/index.html', 'stickman-hook/index.html'
		];
		let pages = [];
		let sortMode = 'name-asc';
		const dateFormatter = new Intl.DateTimeFormat(undefined, { year: 'numeric', month: 'short', day: 'numeric' });

		function pageName(path) {
			const parts = path.split('/');
			return parts.length > 1 ? parts.at(-2) : 'root';
		}

		function openInWindow(path) {
			pageWindowTitle.textContent = pageName(path);
			pageFrame.src = new URL(`./${path}`, document.baseURI).href;
			pageWindow.hidden = false;
			document.body.style.overflow = 'hidden';
		}

		function closePageWindow() {
			pageWindow.hidden = true;
			pageWindow.classList.remove('is-fullscreen');
			pageWindow.classList.remove('is-header-hidden');
			pageWindowFullscreen.textContent = 'Fullscreen';
			pageWindowFullscreen.setAttribute('aria-pressed', 'false');
			setHeaderToggleState(true);
			pageFrame.src = 'about:blank';
			document.body.style.overflow = '';
		}

		function togglePageWindowFullscreen() {
			const isFullscreen = pageWindow.classList.toggle('is-fullscreen');
			pageWindowFullscreen.textContent = isFullscreen ? 'Restore' : 'Fullscreen';
			pageWindowFullscreen.setAttribute('aria-pressed', String(isFullscreen));
			if (!isFullscreen) {
				pageWindow.classList.remove('is-header-hidden');
				setHeaderToggleState(true);
			}
		}

		function setHeaderToggleState(isVisible) {
			pageWindow.classList.toggle('is-header-hidden', !isVisible);
			pageWindowHeaderToggle.textContent = isVisible ? '↑' : '↓';
			pageWindowHeaderToggle.setAttribute('aria-label', isVisible ? 'Hide viewer header' : 'Show viewer header');
			pageWindowHeaderToggle.setAttribute('title', isVisible ? 'Hide viewer header' : 'Show viewer header');
			pageWindowHeaderToggle.setAttribute('aria-expanded', String(isVisible));
		}

		function renderPages() {
			const query = filterElement.value.trim().toLowerCase();
			const visiblePages = pages.filter((page) => page.path.toLowerCase().includes(query)).sort((left, right) => {
				if (sortMode.startsWith('date')) {
					if (!left.dateAdded) return 1;
					if (!right.dateAdded) return -1;
					const comparison = left.dateAdded - right.dateAdded;
					return sortMode.endsWith('desc') ? -comparison : comparison;
				}
				const leftValue = sortMode.startsWith('name') ? pageName(left.path) : left.path;
				const rightValue = sortMode.startsWith('name') ? pageName(right.path) : right.path;
				const comparison = leftValue.localeCompare(rightValue);
				return sortMode.endsWith('desc') ? -comparison : comparison;
			});
			pagesElement.replaceChildren();
			if (!visiblePages.length) {
				const empty = document.createElement('tr');
				const cell = document.createElement('td');
				cell.className = 'empty';
				cell.colSpan = 3;
				cell.textContent = query ? 'No pages match that filter.' : 'No HTML pages were found.';
				empty.append(cell);
				pagesElement.append(empty);
				return;
			}
			visiblePages.forEach((page) => {
				const item = document.createElement('tr');
				const nameCell = document.createElement('td');
				nameCell.className = 'name-cell';
				const icon = document.createElement('span');
				icon.className = 'folder-icon';
				icon.setAttribute('aria-hidden', 'true');
				icon.textContent = '🕹️';
				const link = document.createElement('a');
				link.className = 'page-link';
				link.href = `./${page.path}`;
				link.textContent = pageName(page.path);
				link.addEventListener('click', (event) => {
					event.preventDefault();
					openInWindow(page.path);
				});
				nameCell.append(icon, link);
				const dateCell = document.createElement('td');
				const dateValue = document.createElement('span');
				dateValue.className = 'date-cell';
				dateValue.textContent = page.dateAdded ? dateFormatter.format(page.dateAdded) : 'Unknown';
				dateCell.append(dateValue);
				const openCell = document.createElement('td');
				const openLink = document.createElement('a');
				openLink.className = 'open-link';
				openLink.href = `./${page.path}`;
				openLink.textContent = 'Open';
				openLink.addEventListener('click', (event) => {
					event.preventDefault();
					openInWindow(page.path);
				});
				openCell.append(openLink);
				item.append(nameCell, dateCell, openCell);
				pagesElement.append(item);
			});
		}

		async function loadPages() {
			const endpoint = './directory-pages.json';
			let tree;
			try {
				const response = await fetch(endpoint, { cache: 'no-store' });
				if (!response.ok) throw new Error(`Directory manifest returned ${response.status}`);
				tree = await response.json();
			} catch (error) {
				pages = fallbackPaths.map((path) => ({ path, dateAdded: null }));
				statusElement.textContent = `${pages.length} pages found (cached list)`;
				renderPages();
				console.warn('GitHub directory lookup failed; showing cached paths.', error);
				return;
			}
			pages = tree.map((entry) => ({ path: entry.path, dateAdded: entry.dateAdded ? new Date(entry.dateAdded) : null }));
			statusElement.textContent = `${pages.length} page${pages.length === 1 ? '' : 's'} found`;
			renderPages();
		}

		filterElement.addEventListener('input', renderPages);
		sortElement.addEventListener('change', () => {
			sortMode = sortElement.value;
			renderPages();
		});
		pageWindowClose.addEventListener('click', closePageWindow);
		pageWindowFullscreen.addEventListener('click', togglePageWindowFullscreen);
		pageWindowHeaderToggle.addEventListener('click', () => {
			setHeaderToggleState(pageWindow.classList.contains('is-header-hidden'));
		});
		pageWindowPanic.addEventListener('click', () => { window.location.href = 'https://www.google.com/'; });
		pageWindow.addEventListener('click', (event) => {
			if (event.target === pageWindow) closePageWindow();
		});
		document.addEventListener('keydown', (event) => {
			if (event.key === 'Escape' && !pageWindow.hidden) closePageWindow();
		});
		loadPages().catch((error) => {
			statusElement.textContent = 'Unable to load pages';
			pagesElement.innerHTML = '<tr><td class="empty" colspan="3">The directory could not reach GitHub right now. Please try again shortly.</td></tr>';
			console.error(error);
		});
	</script>
</body>
</html>
