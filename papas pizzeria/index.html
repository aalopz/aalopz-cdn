<!DOCTYPE html>
<html><head>
<meta http-equiv="content-type" content="text/html; charset=windows-1252"><script src="index_files/ruffle_V1II.js"></script></head><body style="margin: 0px"><div id="container" style="width: 100vw; height: 100vh"><ruffle-player style="width: 100%; height: 100%; display: block;"></ruffle-player></div><script type="text/javascript">function play() {
    const ruffle = window.RufflePlayer.newest();
    const player = ruffle.createPlayer();
    player.config = {"splashScreen":true,"contextMenu":"off","autoplay":true,"warnOnUnsupportedContent":false,"allowScriptAccess":true,"maxExecutionDuration":30}
    const container = document.getElementById('container');
    container.appendChild(player);
    player.style.cssText = 'width:100%; height: 100%;';
    player.style.display = 'block';
    player.load("https://files.crazygames.com/papas-pizzeria/1/papaspizzeria_v2.swf").then(() => {
      window.parent.postMessage({ type: 'ruffleready' }, '*');
    });
}
function sendHeartbeat() {
  window.parent.postMessage({type: 'gameIframe-heartbeat'}, '*');
}
sendHeartbeat();
setInterval(sendHeartbeat, 5000);
play();</script></body></html>
