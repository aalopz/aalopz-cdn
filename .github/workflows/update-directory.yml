name: Auto-Update Directory Pages

on:
  push:
    branches:
      - main
    # Removed paths restrictions so it runs when files are deleted too

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Generate directory manifest
      run: |
        printf '[\n' > directory-pages.json
        find . \( -name "index.html" -o -name "index.htm" \) -not -path "./index.html" -not -path "./index.htm" -not -path "*/.*" -print0 | sort -z | while IFS= read -r -d '' file; do
          path=${file#./}
          date=$(git log --follow --diff-filter=A --format=%cI -- "$file" | tail -n 1)
          dateValue=null
          if [ -n "$date" ]; then dateValue="\"$date\""; fi
          printf '  {"path": "%s", "dateAdded": %s},\n' "$path" "$dateValue" >> directory-pages.json
        done
        sed -i '$ s/,$//' directory-pages.json
        printf ']\n' >> directory-pages.json

    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add directory-pages.json
        if ! git diff --cached --quiet; then
          git commit -m "chore: auto-update directory mapping [skip ci]"
          git push
        else
          echo "No folder changes detected."
        fi
