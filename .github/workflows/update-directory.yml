name: Auto-Update Directory Pages

on:
  push:
    branches:
      - main
    # Removed paths restrictions so it runs when files are deleted too

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Scan HTML/HTM Files and Inject Data
      run: |
        # Use find to locate all sub-directory index files safely
        FILES=$(find . \( -name "index.html" -o -name "index.htm" \) -not -path "./index.html" -not -path "./index.htm" -not -path "*/.*")
        
        # Build the clean JSON array string
        JSON_ARRAY="const pages = ["
        for file in $FILES; do
          CLEAN_PATH=$(echo "$file" | sed 's|^\./||')
          FOLDER_NAME=$(dirname "$CLEAN_PATH")
          JSON_ARRAY="$JSON_ARRAY{\"name\": \"$FOLDER_NAME\", \"url\": \"$CLEAN_PATH\"},"
        done
        
        # Format closing array boundaries cleanly
        JSON_ARRAY=$(echo "$JSON_ARRAY" | sed 's/,$//')
        JSON_ARRAY="$JSON_ARRAY];"
        
        # Inject updated paths array into the main directory index.html
        sed -i "s|const pages = \[\];|${JSON_ARRAY}|" index.html

    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add index.html
        if ! git diff --cached --quiet; then
          git commit -m "chore: auto-update directory mapping [skip ci]"
          git push
        else
          echo "No folder changes detected."
        fi
