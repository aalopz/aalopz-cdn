<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>aalopz CDN</title>
	<style>
		:root { color-scheme: light; --blue: #1a73e8; --blue-soft: #e8f0fe; --ink: #202124; --muted: #5f6368; --line: #dadce0; --surface: #fff; --page: #fff; --hover: #f8fafd; }
		* { box-sizing: border-box; }
		body { margin: 0; min-width: 320px; color: var(--ink); background: var(--page); font: 14px Arial, sans-serif; }
		button, input { font: inherit; }
		button { border: 0; cursor: pointer; }
		.topbar { display: flex; align-items: center; gap: 24px; height: 64px; padding: 0 24px; border-bottom: 1px solid var(--line); }
		.brand { display: flex; align-items: center; gap: 10px; min-width: 220px; color: var(--muted); font-size: 20px; }
		.brand-mark { display: grid; width: 30px; height: 30px; place-items: center; color: #fff; background: var(--blue); font-weight: 700; }
		.search { display: flex; align-items: center; width: min(720px, 100%); height: 46px; padding: 0 16px; border-radius: 24px; background: #f1f3f4; }
		.search:focus-within { background: #fff; box-shadow: 0 1px 3px rgba(60, 64, 67, .28); }
		.search-icon { margin-right: 12px; color: var(--muted); font-size: 20px; }
		#filter { width: 100%; border: 0; outline: 0; color: var(--ink); background: transparent; }
		.account { margin-left: auto; color: var(--muted); font-size: 18px; white-space: nowrap; }
		.layout { display: flex; min-height: calc(100vh - 64px); }
		.sidebar { width: 240px; padding: 20px 12px; border-right: 1px solid var(--line); }
		.new-button { display: flex; align-items: center; gap: 12px; width: 112px; height: 48px; margin: 0 0 24px 8px; padding: 0 18px; border: 1px solid var(--line); border-radius: 24px; color: var(--ink); background: #fff; box-shadow: 0 1px 2px rgba(60, 64, 67, .2); font-size: 15px; }
		.new-button:hover { background: var(--hover); box-shadow: 0 2px 5px rgba(60, 64, 67, .2); }
		.plus { color: var(--blue); font-size: 24px; font-weight: 300; }
		.nav-item { display: flex; align-items: center; gap: 16px; width: 100%; padding: 10px 20px; border-radius: 0 18px 18px 0; color: var(--ink); text-decoration: none; }
		.nav-item.active { color: #174ea6; background: var(--blue-soft); font-weight: 700; }
		.nav-icon { width: 18px; color: var(--muted); text-align: center; font-size: 17px; }
		.content { width: min(1200px, 100%); padding: 32px 32px 56px; }
		.breadcrumb { display: flex; align-items: center; gap: 8px; margin: 0 0 28px; color: var(--muted); font-size: 22px; }
		.breadcrumb strong { color: var(--ink); font-weight: 400; }
		.breadcrumb span { color: var(--muted); }
		.toolbar { display: flex; align-items: center; justify-content: space-between; min-height: 42px; margin-bottom: 16px; }
		.toolbar h1 { margin: 0; font-size: 16px; font-weight: 400; }
		#status { color: var(--muted); font-size: 13px; }
		.table { width: 100%; border-collapse: collapse; table-layout: fixed; }
		.table th { padding: 0 12px 12px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 12px; font-weight: 400; text-align: left; }
		.table th:first-child { width: 48%; }
		.table th:last-child { width: 100px; }
		.table td { height: 58px; padding: 8px 12px; border-bottom: 1px solid #f1f3f4; overflow: hidden; color: var(--muted); text-overflow: ellipsis; white-space: nowrap; }
		.table tr:hover td { background: var(--hover); }
		.name-cell { display: flex; align-items: center; gap: 14px; color: var(--ink); }
		.folder-icon { color: #5f6368; font-size: 20px; }
		.page-link { overflow: hidden; color: var(--ink); text-decoration: none; text-overflow: ellipsis; }
		.page-link:hover { color: var(--blue); text-decoration: underline; }
		.open-link { color: var(--blue); text-decoration: none; }
		.open-link:hover { text-decoration: underline; }
		.empty { padding: 28px 12px; color: var(--muted); }
		@media (max-width: 720px) {
			.topbar { gap: 12px; padding: 0 14px; }
			.brand { min-width: auto; }
			.brand span:last-child, .account { display: none; }
			.sidebar { width: 62px; padding: 20px 8px; }
			.new-button { width: 46px; margin-left: 0; padding: 0; justify-content: center; }
			.new-button span:last-child, .nav-item span:last-child { display: none; }
			.nav-item { justify-content: center; padding: 10px 0; }
			.content { padding: 24px 14px 40px; }
			.table th:nth-child(2), .table td:nth-child(2), .table th:nth-child(3), .table td:nth-child(3) { display: none; }
			.table th:first-child { width: 75%; }
		}
	</style>
</head>
<body>
	<header class="topbar">
		<div class="brand"><span class="brand-mark">a</span><span>aalopz CDN</span></div>
		<label class="search" for="filter"><span class="search-icon" aria-hidden="true">⌕</span><input id="filter" type="search" placeholder="Search in My Drive" aria-label="Search in My Drive"></label>
		<div class="account" aria-hidden="true">●</div>
	</header>
	<div class="layout">
		<aside class="sidebar" aria-label="Drive navigation">
			<button class="new-button" type="button"><span class="plus" aria-hidden="true">+</span><span>New</span></button>
			<a class="nav-item active" href="./"><span class="nav-icon" aria-hidden="true">▣</span><span>My Drive</span></a>
			<a class="nav-item" href="https://github.com/aalopz/aalopz-cdn" rel="noreferrer"><span class="nav-icon" aria-hidden="true">↗</span><span>Repository</span></a>
		</aside>
		<main class="content">
			<nav class="breadcrumb" aria-label="Breadcrumb"><strong>My Drive</strong><span aria-hidden="true">›</span><span>Games</span></nav>
			<div class="toolbar"><h1>Games</h1><p id="status" aria-live="polite">Loading pages...</p></div>
			<table class="table">
				<thead><tr><th>Name</th><th>Type</th><th>Location</th><th>Open</th></tr></thead>
				<tbody id="pages" aria-live="polite"></tbody>
			</table>
		</main>
	</div>
	<script>
		const repository = 'aalopz/aalopz-cdn';
		const branch = 'main';
		const pagesElement = document.querySelector('#pages');
		const statusElement = document.querySelector('#status');
		const filterElement = document.querySelector('#filter');
		let pages = [];

		function pageName(path) {
			const parts = path.split('/');
			return parts.length > 1 ? parts.at(-2) : 'root';
		}

		function renderPages() {
			const query = filterElement.value.trim().toLowerCase();
			const visiblePages = pages.filter((page) => page.path.toLowerCase().includes(query));
			pagesElement.replaceChildren();
			if (!visiblePages.length) {
				const empty = document.createElement('tr');
				const cell = document.createElement('td');
				cell.className = 'empty';
				cell.colSpan = 4;
				cell.textContent = query ? 'No pages match that filter.' : 'No HTML pages were found.';
				empty.append(cell);
				pagesElement.append(empty);
				return;
			}
			visiblePages.forEach((page) => {
				const item = document.createElement('tr');
				const nameCell = document.createElement('td');
				nameCell.className = 'name-cell';
				const icon = document.createElement('span');
				icon.className = 'folder-icon';
				icon.setAttribute('aria-hidden', 'true');
				icon.textContent = '▰';
				const link = document.createElement('a');
				link.className = 'page-link';
				link.href = `./${page.path}`;
				link.textContent = pageName(page.path);
				nameCell.append(icon, link);
				const typeCell = document.createElement('td');
				typeCell.textContent = 'Folder';
				const locationCell = document.createElement('td');
				locationCell.textContent = 'My Drive';
				const openCell = document.createElement('td');
				const openLink = document.createElement('a');
				openLink.className = 'open-link';
				openLink.href = `./${page.path}`;
				openLink.textContent = 'Open';
				openCell.append(openLink);
				item.append(nameCell, typeCell, locationCell, openCell);
				pagesElement.append(item);
			});
		}

		async function loadPages() {
			const endpoint = `https://api.github.com/repos/${repository}/git/trees/${branch}?recursive=1`;
			const response = await fetch(endpoint, { headers: { Accept: 'application/vnd.github+json' } });
			if (!response.ok) throw new Error(`GitHub returned ${response.status}`);
			const tree = await response.json();
			pages = tree.tree.filter((entry) => entry.type === 'blob' && /(^|\/)index\.html?$/i.test(entry.path) && entry.path !== 'index.html').map((entry) => ({ path: entry.path })).sort((left, right) => left.path.localeCompare(right.path));
			statusElement.textContent = `${pages.length} page${pages.length === 1 ? '' : 's'} found`;
			renderPages();
		}

		filterElement.addEventListener('input', renderPages);
		loadPages().catch((error) => {
			statusElement.textContent = 'Unable to load pages';
			pagesElement.innerHTML = '<tr><td class="empty" colspan="4">The directory could not reach GitHub right now. Please try again shortly.</td></tr>';
			console.error(error);
		});
	</script>
</body>
</html>
