<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>aalopz CDN launcher</title>
	<style>
		:root { color-scheme: dark; --bg: #181818; --panel: #222; --ink: #f1f1f1; --muted: #aaa; --line: #444; --hover: #303030; }
		* { box-sizing: border-box; }
		body { display: grid; min-width: 320px; min-height: 100vh; place-items: center; margin: 0; padding: 24px; color: var(--ink); background: var(--bg); font: 16px Arial, sans-serif; }
		.launcher { width: min(520px, 100%); padding: 28px; border: 1px solid var(--line); background: var(--panel); text-align: center; }
		h1 { margin: 0 0 8px; font-size: 24px; font-weight: 400; }
		p { margin: 0 0 24px; color: var(--muted); line-height: 1.5; }
		.buttons { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; }
		button { padding: 11px 14px; border: 1px solid var(--line); border-radius: 3px; color: var(--ink); background: var(--panel); cursor: pointer; font: inherit; }
		button:hover { background: var(--hover); }
		#status { min-height: 22px; margin-top: 18px; margin-bottom: 0; font-size: 13px; }
	</style>
</head>
<body>
	<main class="launcher">
		<h1>aalopz CDN launcher</h1>
		<p>Choose how you want to launch the page.</p>
		<div class="buttons">
			<button id="about-blank-button" type="button">Open in about:blank</button>
			<button id="blob-button" type="button">Open as Blob</button>
			<button id="data-button" type="button">Open as Data URI</button>
		</div>
		<p id="status" aria-live="polite"></p>
	</main>
	<script>
		const mainPageUrl = './main.html';
		const statusElement = document.querySelector('#status');

		async function getMainPage() {
			const response = await fetch(mainPageUrl);
			if (!response.ok) throw new Error(`Could not load main.html (${response.status})`);
			return response.text();
		}

		function addBaseUrl(html) {
			const baseUrl = new URL(mainPageUrl, window.location.href).href;
			return html.replace(/<head([^>]*)>/i, `<head$1><base href="${baseUrl}">`);
		}

		async function openAboutBlank() {
			const newTab = window.open('about:blank', '_blank');
			if (!newTab) throw new Error('The browser blocked the new tab.');
			const pageUrl = new URL(mainPageUrl, window.location.href).href;
			newTab.document.open();
			newTab.document.write(`<!doctype html><html><head><title>main.html</title></head><body style="margin:0;height:100vh;overflow:hidden"><iframe src="${pageUrl}" title="main.html" style="display:block;width:100%;height:100%;border:0"></iframe></body></html>`);
			newTab.document.close();
		}

		async function openBlob() {
			const newTab = window.open('about:blank', '_blank');
			if (!newTab) throw new Error('The browser blocked the new tab.');
			const blob = new Blob([addBaseUrl(await getMainPage())], { type: 'text/html' });
			const blobUrl = URL.createObjectURL(blob);
			newTab.location.href = blobUrl;
			setTimeout(() => URL.revokeObjectURL(blobUrl), 60000);
		}

		async function openDataUri() {
			const newTab = window.open('about:blank', '_blank');
			if (!newTab) throw new Error('The browser blocked the new tab.');
			const html = addBaseUrl(await getMainPage());
			const bytes = new TextEncoder().encode(html);
			let binary = '';
			bytes.forEach((byte) => { binary += String.fromCharCode(byte); });
			newTab.location.href = `data:text/html;base64,${btoa(binary)}`;
		}

		async function launch(openFunction) {
			statusElement.textContent = 'Opening...';
			try {
				await openFunction();
				statusElement.textContent = 'Opened main.html.';
			} catch (error) {
				statusElement.textContent = error.message;
			}
		}

		document.querySelector('#about-blank-button').addEventListener('click', () => launch(openAboutBlank));
		document.querySelector('#blob-button').addEventListener('click', () => launch(openBlob));
		document.querySelector('#data-button').addEventListener('click', () => launch(openDataUri));
	</script>
</body>
</html>
