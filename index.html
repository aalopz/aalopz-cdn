<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>aalopz CDN launcher</title>
	<style>
		:root { color-scheme: dark; --bg: #000; --panel: #161616; --ink: #f1f1f1; --muted: #aaa; --line: #444; --hover: #303030; }
		* { box-sizing: border-box; }
		body { display: grid; min-width: 320px; min-height: 100vh; place-items: center; margin: 0; padding: 24px; color: var(--ink); background-color: var(--bg); background-image: linear-gradient(rgba(255, 255, 255, .035) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, .035) 1px, transparent 1px), linear-gradient(to bottom, #080817 0%, #191a3e 48%, #45478f 100%); background-repeat: repeat, repeat, no-repeat; background-attachment: fixed, fixed, fixed; background-size: 40px 40px, 40px 40px, 100% 100%; font: 16px Arial, sans-serif; }
		.launcher { width: min(520px, 100%); padding: 28px; border: 1px solid var(--line); border-radius: 8px; background: rgba(70, 70, 70, .3); text-align: center; }
		h1 { margin: 0 0 8px; font-size: 24px; font-weight: 400; }
		p { margin: 0 0 24px; color: var(--muted); line-height: 1.5; }
		.buttons { display: flex; width: 100%; align-items: center; justify-content: center; flex-wrap: wrap; gap: 12px; margin: 0 auto; }
		button { padding: 11px 14px; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); background: rgba(25, 25, 25, .55); cursor: pointer; font: inherit; }
		button:hover { background: var(--hover); }
		button:disabled { cursor: wait; opacity: .6; }
		#status { min-height: 22px; margin-top: 18px; margin-bottom: 0; font-size: 13px; }
	</style>
</head>
<body>
	<main class="launcher">
		<h1>CDN launcher</h1>
		<p>Choose how you want to launch the page.</p>
		<div class="buttons">
			<button id="about-blank-button" type="button">Open in about:blank</button>
			<button id="normal-button" type="button">Open normally</button>
			<button id="blob-button" type="button">Open as Blob</button>
			<button id="data-button" type="button" disabled>Preparing Data URI...</button>
		</div>
		<p id="status" aria-live="polite"></p>
	</main>
	<script>
		const mainPageUrl = './main.html';
		const statusElement = document.querySelector('#status');
		const dataButton = document.querySelector('#data-button');
		let dataUriUrl = '';

		async function getMainPage() {
			const response = await fetch(mainPageUrl);
			if (!response.ok) throw new Error(`Could not load main.html (${response.status})`);
			return response.text();
		}

		function addBaseUrl(html) {
			const baseUrl = new URL(mainPageUrl, window.location.href).href;
			return html.replace(/<head([^>]*)>/i, `<head$1><base href="${baseUrl}">`);
		}

		function openAboutBlank() {
			const newTab = window.open('about:blank', '_blank');
			if (!newTab) throw new Error('The browser blocked the new tab.');
			const pageUrl = new URL(mainPageUrl, window.location.href).href;
			const popupDocument = newTab.document;
			popupDocument.title = 'CDN';
			popupDocument.body.style.cssText = 'margin:0;height:100vh;overflow:hidden';
			const frame = popupDocument.createElement('iframe');
			frame.src = pageUrl;
			frame.title = 'main.html';
			frame.style.cssText = 'display:block;width:100%;height:100%;border:0';
			popupDocument.body.append(frame);
		}

		function openNormally() {
			const newTab = window.open(mainPageUrl, '_blank');
			if (!newTab) throw new Error('The browser blocked the new tab.');
		}

		async function openBlob() {
			const newTab = window.open('about:blank', '_blank');
			if (!newTab) throw new Error('The browser blocked the new tab.');
			const blob = new Blob([addBaseUrl(await getMainPage())], { type: 'text/html' });
			const blobUrl = URL.createObjectURL(blob);
			newTab.location.href = blobUrl;
			setTimeout(() => URL.revokeObjectURL(blobUrl), 60000);
		}

		function openDataUri() {
			if (!dataUriUrl) throw new Error('The Data URI is still preparing.');
			const newTab = window.open('about:blank', '_blank');
			if (!newTab) throw new Error('The browser blocked the new tab.');
			const popupDocument = newTab.document;
			popupDocument.title = 'CDN';
			popupDocument.body.style.cssText = 'margin:0;height:100vh;overflow:hidden';
			const frame = popupDocument.createElement('iframe');
			frame.src = dataUriUrl;
			frame.title = 'CDN';
			frame.style.cssText = 'display:block;width:100%;height:100%;border:0';
			popupDocument.body.append(frame);
		}

		async function prepareDataUri() {
			const html = addBaseUrl(await getMainPage());
			const bytes = new TextEncoder().encode(html);
			let binary = '';
			bytes.forEach((byte) => { binary += String.fromCharCode(byte); });
			dataUriUrl = `data:text/html;base64,${btoa(binary)}`;
			dataButton.disabled = false;
			dataButton.textContent = 'Open as Data URI';
		}

		async function launch(openFunction) {
			statusElement.textContent = 'Opening...';
			try {
				await openFunction();
				statusElement.textContent = 'Opened main.html.';
			} catch (error) {
				statusElement.textContent = error.message;
			}
		}

		document.querySelector('#about-blank-button').addEventListener('click', () => launch(openAboutBlank));
		document.querySelector('#normal-button').addEventListener('click', () => launch(openNormally));
		document.querySelector('#blob-button').addEventListener('click', () => launch(openBlob));
		document.querySelector('#data-button').addEventListener('click', () => launch(openDataUri));
		prepareDataUri().catch((error) => {
			dataButton.textContent = 'Data URI unavailable';
			statusElement.textContent = error.message;
		});
	</script>
</body>
</html>
